{% extends 'layout.html' %}

{% block content %}
{% if action == 'new' %}
    <p>
      <a href="{{ url_for('ui_bp.index') }}">home</a> > 
      <a href="{{ url_for('student_bp.students_list') }}">alunos</a> > 
      adicionar novo aluno
    </p>
    <h2>Adicionar Aluno</h2>
{% elif action == 'edit' %}
    <p>
      <a href="{{ url_for('ui_bp.index') }}">home</a> > 
      <a href="{{ url_for('student_bp.students_list') }}">alunos</a> > 
      editar aluno
    </p>
    <h2>Editar Aluno</h2>
{% endif %}

<form method="POST">
    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" name="nome" 
           value="{{ student.nome if student else '' }}"
           required>
    <br><br>

    <label for="email">E-mail:</label><br>
    <input type="email" id="email" name="email"
           value="{{ student.email if student else '' }}"
           required>
    <br><br>

    <button type="submit">
        {% if action == 'new' %}Criar{% else %}Salvar Alterações{% endif %}
    </button>
</form>
{% endblock %}
